[package]
name = "kota"
version = "0.1.4"
edition = "2024"
authors = ["Stepfen Shawn <m18824909883@163.com>"]
license = "MIT"
description = "A lightweight, highly extensible ai code agent, built in Rust."
repository = "https://github.com/StepfenShawn/kota"
documentation = "https://docs.rs/kota"
readme = "README.md"
keywords = ["ai", "agent", "llm", "code-assistant", "automation"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "kota"
path = "src/main.rs"

[lib]
name = "kota"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0"
rustyline = "14.0"
colored = "3.0.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
patch-apply = "0.8.3"
regex = "1.0"
walkdir = "2.0"
chrono = { version = "0.4", features = ["serde"] }
ignore = "0.4"
names = { version = "0.14.0", default-features = false }
mlua = { version = "0.9", features = ["lua54", "vendored"] }
rmcp = { version = "0.14.0", features = ["client", "transport-child-process"] }

[dev-dependencies]
tempfile = "3.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
